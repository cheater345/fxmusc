name: Build fxmusc APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - apk
          - appbundle

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Enable Android licenses
        run: |
          yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Patch inappwebview proguard-android.txt
        run: |
          IN_APP_WEBVIEW_GRADLE="/home/runner/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          if [ -f "$IN_APP_WEBVIEW_GRADLE" ]; then
            sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$IN_APP_WEBVIEW_GRADLE"
            echo "Patched $IN_APP_WEBVIEW_GRADLE"
          else
            echo "flutter_inappwebview_android build.gradle not found at expected path, trying find..."
            IN_APP_WEBVIEW_GRADLE=$(find "$HOME/.pub-cache" -name "flutter_inappwebview_android*" -path "*/android/build.gradle" 2>/dev/null | head -1)
            if [ -f "$IN_APP_WEBVIEW_GRADLE" ]; then
              sed -i "s/getDefaultProguardFile('proguard-android.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$IN_APP_WEBVIEW_GRADLE"
              echo "Patched $IN_APP_WEBVIEW_GRADLE"
            else
              echo "flutter_inappwebview_android build.gradle not found, skipping patch"
            fi
          fi

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'appbundle'
        run: flutter build apk --debug

      - name: Build Release APK
        if: github.event.inputs.build_type == 'apk'
        run: flutter build apk --release

      - name: Build App Bundle
        if: github.event.inputs.build_type == 'appbundle'
        run: flutter build appbundle

      - name: Verify APK
        if: always()
        run: |
          find . -path ./build -prune -o -name "*.apk" -type f -print | while read apk; do
            echo "Found APK: $apk"
          done

      - name: Upload Debug APK
        if: always() && github.event.inputs.build_type != 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: fxmusc-debug-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload App Bundle
        if: success() && github.event.inputs.build_type == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: fxmusc-appbundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
